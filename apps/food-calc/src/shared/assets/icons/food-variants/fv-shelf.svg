<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="280" cy="810" r="181" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#m)">
      <!-- лавочный стеллаж: банки на двух полках -->
      <rect x="220" y="240" width="26" height="600"/>
      <rect x="560" y="240" width="26" height="600"/>
      <rect x="200" y="520" width="386" height="30" rx="12"/>
      <rect x="200" y="840" width="624" height="30" rx="12"/>
      <!-- верхняя полка: две банки -->
      <rect x="290" y="360" width="120" height="160" rx="22"/>
      <rect x="300" y="330" width="100" height="34" rx="12"/>
      <rect x="440" y="380" width="110" height="140" rx="20"/>
      <rect x="449" y="352" width="92" height="32" rx="12"/>
      <!-- нижняя полка: каравай, две банки и бутыль -->
      <ellipse cx="360" cy="760" rx="110" ry="60"/>
      <rect x="520" y="690" width="100" height="150" rx="20"/>
      <rect x="529" y="662" width="82" height="32" rx="12"/>
      <rect x="660" y="710" width="90" height="130" rx="18"/>
      <rect x="668" y="684" width="74" height="30" rx="12"/>
    </g>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="280" cy="810" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="258" y="735" width="44" height="150" rx="14"/>
    <rect x="205" y="788" width="150" height="44" rx="14"/>
  </g>
</svg>
