<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="280" cy="810" r="181" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#m)">
      <!-- тарелка-меню: ободок тарелки, внутри вместо еды — строки списка -->
      <circle cx="410" cy="570" r="240" fill="none" stroke="#fff" stroke-width="52"/>
      <circle cx="300" cy="462" r="24"/>
      <rect x="352" y="440" width="200" height="44" rx="22"/>
      <circle cx="300" cy="564" r="24"/>
      <rect x="352" y="542" width="150" height="44" rx="22"/>
      <circle cx="300" cy="666" r="24"/>
      <rect x="352" y="644" width="220" height="44" rx="22"/>
    </g>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="280" cy="810" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="258" y="735" width="44" height="150" rx="14"/>
    <rect x="205" y="788" width="150" height="44" rx="14"/>
  </g>
</svg>
