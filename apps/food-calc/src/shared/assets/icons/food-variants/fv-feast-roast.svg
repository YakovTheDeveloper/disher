<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="240" cy="750" r="181" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#m)">
      <!-- жареная птица на блюде: тушка, ножка сбоку на блюде, пар -->
      <ellipse cx="470" cy="730" rx="330" ry="66"/>
      <ellipse cx="440" cy="560" rx="240" ry="150"/>
      <!-- ножка лежит на блюде справа -->
      <rect x="600" y="622" width="170" height="68" rx="34"/>
      <circle cx="790" cy="636" r="28"/>
      <circle cx="796" cy="678" r="26"/>
      <!-- пар: три волны -->
      <path d="M 320 380 C 296 336 344 316 320 272" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
      <path d="M 430 360 C 406 316 454 296 430 252" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
      <path d="M 540 380 C 516 336 564 316 540 272" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
    </g>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="240" cy="750" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="218" y="675" width="44" height="150" rx="14"/>
    <rect x="165" y="728" width="150" height="44" rx="14"/>
  </g>
</svg>
