    <g mask="url(#m)">
      <path d="M 400 420 C 600 390 780 430 850 540 C 880 590 872 640 850 660 C 860 700 850 760 820 800 C 806 818 786 822 774 812 C 790 780 796 740 788 700 C 760 560 660 500 560 490 C 500 484 440 500 420 530 Z"/>
      <ellipse cx="340" cy="520" rx="100" ry="170" transform="rotate(12 340 520)"/>
    </g>
    <!-- изобилие из устья -->
    <g mask="url(#m)">
      <circle cx="215" cy="365" r="56"/>
      <path d="M 217 297 C 249 269 291 271 301 281 C 289 309 253 317 219 311 Z"/>
      <circle cx="150" cy="500" r="34"/>
      <circle cx="108" cy="570" r="30"/>
      <circle cx="158" cy="625" r="28"/>
      <path d="M 196 660 C 164 698 164 750 200 770 C 236 790 282 768 286 726 C 290 690 254 654 228 636 C 212 624 208 640 196 660 Z"/>
    </g>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="240" cy="770" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="218" y="695" width="44" height="150" rx="14"/>
    <rect x="165" y="748" width="150" height="44" rx="14"/>
  </g>
</svg>
