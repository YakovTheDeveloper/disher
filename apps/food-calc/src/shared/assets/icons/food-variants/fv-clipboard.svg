<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="260" cy="770" r="181" fill="#000"/>
      <!-- отделяем клип от доски -->
      <rect x="322" y="296" width="160" height="18" rx="9" fill="#000"/>
      <!-- строки списка -->
      <circle cx="304" cy="440" r="22" fill="#000"/>
      <rect x="352" y="420" width="170" height="40" rx="20" fill="#000"/>
      <circle cx="304" cy="560" r="22" fill="#000"/>
      <rect x="352" y="540" width="130" height="40" rx="20" fill="#000"/>
      <circle cx="304" cy="680" r="22" fill="#000"/>
      <rect x="352" y="660" width="190" height="40" rx="20" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <!-- планшет со списком: доска, клип сверху, три пункта -->
    <g mask="url(#m)">
      <rect x="222" y="280" width="360" height="520" rx="44"/>
      <rect x="322" y="210" width="160" height="100" rx="34"/>
    </g>
    <circle cx="402" cy="252" r="18"/>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="260" cy="770" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="238" y="695" width="44" height="150" rx="14"/>
    <rect x="185" y="748" width="150" height="44" rx="14"/>
  </g>
</svg>
