<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="310" cy="580" r="181" fill="#000"/>
      <!-- полость устья -->
      <ellipse cx="372" cy="392" rx="104" ry="70" fill="#000" transform="rotate(32 372 392)"/>
      <!-- зазор между изобилием и устьем -->
      <path d="M 224 290 Q 384 250 504 330" fill="none" stroke="#000" stroke-width="18"/>
    </mask>
  </defs>
  <g fill="#fff">
    <!-- зеркальный рог: устье слева-вверху, остриё уходит вправо-вниз -->
    <g mask="url(#m)">
      <path d="M 512 486 C 624 580 694 710 716 842 C 720 872 706 892 680 890 C 654 886 642 858 628 824 C 568 700 454 580 288 478 Z"/>
      <ellipse cx="372" cy="392" rx="158" ry="116" transform="rotate(32 372 392)"/>
    </g>
    <!-- изобилие: яблоко + гроздь -->
    <circle cx="308" cy="204" r="58"/>
    <path d="M 304 136 C 272 106 226 108 214 118 C 226 150 266 160 302 152 Z"/>
    <circle cx="476" cy="216" r="36"/>
    <circle cx="420" cy="176" r="38"/>
    <circle cx="368" cy="210" r="34"/>
    <circle cx="432" cy="246" r="30"/>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="310" cy="580" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="288" y="505" width="44" height="150" rx="14"/>
    <rect x="235" y="558" width="150" height="44" rx="14"/>
  </g>
</svg>
