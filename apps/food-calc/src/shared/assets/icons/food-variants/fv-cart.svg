      <rect x="330" y="500" width="18" height="240" fill="#000"/>
      <rect x="430" y="500" width="18" height="240" fill="#000"/>
      <rect x="530" y="500" width="18" height="240" fill="#000"/>
      <rect x="630" y="500" width="18" height="240" fill="#000"/>
      <rect x="300" y="585" width="500" height="18" fill="#000"/>
      <rect x="300" y="670" width="500" height="18" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <!-- покупки: пакет и бутыль выступают из корзины -->
    <path d="M 470 240 L 585 240 L 600 495 L 455 495 Z"/>
    <path d="M 482 240 A 38 38 0 0 1 552 240" fill="none" stroke="#fff" stroke-width="22"/>
    <rect x="352" y="280" width="46" height="60" rx="12"/>
