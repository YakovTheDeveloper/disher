<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="290" cy="760" r="181" fill="#000"/>
      <!-- полость чаши -->
      <ellipse cx="400" cy="380" rx="140" ry="50" fill="#000"/>
      <!-- отсечка ножки от чаши -->
      <path d="M 318 640 Q 400 668 482 640" fill="none" stroke="#000" stroke-width="16"/>
    </mask>
  </defs>
  <g fill="#fff">
    <!-- рог-ваза: чаша-устье в изометрии, тело сходится к малому основанию -->
    <g mask="url(#m)">
      <ellipse cx="400" cy="380" rx="180" ry="70"/>
      <path d="M 226 400 C 260 556 316 696 366 760 L 434 760 C 484 696 540 556 574 400 C 512 448 288 448 226 400 Z"/>
      <ellipse cx="400" cy="770" rx="72" ry="24"/>
    </g>
    <!-- изобилие в чаше -->
    <circle cx="340" cy="300" r="54"/>
    <path d="M 342 238 C 372 210 412 212 422 222 C 412 248 378 256 344 250 Z"/>
    <circle cx="448" cy="290" r="36"/>
    <circle cx="504" cy="322" r="30"/>
    <circle cx="444" cy="346" r="26"/>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="290" cy="760" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="268" y="685" width="44" height="150" rx="14"/>
    <rect x="215" y="738" width="150" height="44" rx="14"/>
  </g>
</svg>
