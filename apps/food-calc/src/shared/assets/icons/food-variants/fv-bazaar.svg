<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="300" cy="830" r="181" fill="#000"/>
      <!-- полосы тента -->
      <rect x="262" y="300" width="26" height="170" fill="#000"/>
      <rect x="352" y="300" width="26" height="170" fill="#000"/>
      <rect x="442" y="300" width="26" height="170" fill="#000"/>
      <rect x="532" y="300" width="26" height="170" fill="#000"/>
      <!-- фестоны нижнего края -->
      <circle cx="142" cy="470" r="32" fill="#000"/>
      <circle cx="212" cy="470" r="32" fill="#000"/>
      <circle cx="282" cy="470" r="32" fill="#000"/>
      <circle cx="352" cy="470" r="32" fill="#000"/>
      <circle cx="422" cy="470" r="32" fill="#000"/>
      <circle cx="492" cy="470" r="32" fill="#000"/>
      <circle cx="562" cy="470" r="32" fill="#000"/>
      <circle cx="632" cy="470" r="32" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#m)">
      <!-- рыночный ряд: полосатый тент над лотком -->
      <path d="M 180 300 L 600 300 L 670 470 L 110 470 Z"/>
    <!-- опоры -->
    <rect x="208" y="500" width="22" height="384"/>
    <rect x="560" y="500" width="22" height="384"/>
    <!-- прилавок -->
    <rect x="250" y="690" width="400" height="26" rx="13"/>
    <rect x="272" y="716" width="356" height="168"/>
    <!-- ящик с фруктами -->
    <rect x="310" y="590" width="150" height="100" rx="10"/>
    <circle cx="342" cy="576" r="28"/>
    <circle cx="385" cy="562" r="30"/>
    <circle cx="428" cy="576" r="28"/>
    <!-- каравай -->
    <ellipse cx="540" cy="626" rx="86" ry="42"/>
    </g>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="300" cy="830" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="278" y="755" width="44" height="150" rx="14"/>
