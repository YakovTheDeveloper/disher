<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="300" cy="830" r="181" fill="#000"/>
      <!-- щели между досками ящика -->
      <rect x="220" y="690" width="584" height="20" fill="#000"/>
      <rect x="220" y="780" width="584" height="20" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <!-- урожай над краем: три томата с листом -->
    <circle cx="392" cy="520" r="72"/>
    <circle cx="512" cy="470" r="82"/>
    <circle cx="632" cy="520" r="72"/>
    <path d="M 512 372 C 500 330 520 300 560 290 C 556 330 540 360 512 372 Z"/>
    <path d="M 512 372 C 524 330 504 300 464 290 C 468 330 484 360 512 372 Z"/>
    <!-- ящик -->
    <g mask="url(#m)">
      <path d="M 240 560 L 784 560 L 744 884 L 280 884 Z"/>
    </g>
    <!-- верхний обод -->
    <rect x="220" y="536" width="584" height="46" rx="20"/>
    <!-- уголковые стойки -->
    <rect x="250" y="582" width="34" height="302"/>
    <rect x="740" y="582" width="34" height="302"/>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="300" cy="830" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="278" y="755" width="44" height="150" rx="14"/>
    <rect x="225" y="808" width="150" height="44" rx="14"/>
  </g>
</svg>
