    <circle cx="240" cy="780" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="218" y="705" width="44" height="150" rx="14"/>
    <rect x="165" y="758" width="150" height="44" rx="14"/>
  </g>
</svg>
