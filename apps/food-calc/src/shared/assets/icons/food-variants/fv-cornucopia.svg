<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="240" cy="780" r="181" fill="#000"/>
      <!-- полость устья -->
      <ellipse cx="325" cy="415" rx="72" ry="145" fill="#000" transform="rotate(20 325 415)"/>
      <!-- плетение корзины: диагональные прутья -->
      <path d="M 395 520 L 515 380" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round"/>
      <path d="M 465 575 L 575 445" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round"/>
      <path d="M 535 625 L 640 510" fill="none" stroke="#000" stroke-width="15" stroke-linecap="round"/>
      <path d="M 605 670 L 700 575" fill="none" stroke="#000" stroke-width="15" stroke-linecap="round"/>
      <path d="M 675 710 L 755 635" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round"/>
    </mask>
  </defs>
  <g fill="#fff">
    <!-- плетёный рог на боку (по референсу): устье слева, тело дугой вниз-вправо -->
    <g mask="url(#m)">
      <path d="M 350 300 C 570 360 750 510 822 692 C 838 728 834 762 812 776 C 806 738 782 698 744 656 C 650 560 520 500 410 505 Z"/>
      <ellipse cx="325" cy="415" rx="115" ry="195" transform="rotate(20 325 415)"/>
    </g>
    <!-- изобилие из устья: яблоко с листом, висящая гроздь, груша -->
    <g mask="url(#m)">
      <circle cx="198" cy="345" r="64"/>
      <path d="M 200 268 C 236 236 284 238 296 250 C 282 282 240 292 202 284 Z"/>
      <circle cx="245" cy="600" r="42"/>
      <circle cx="168" cy="656" r="38"/>
      <circle cx="315" cy="662" r="38"/>
      <circle cx="235" cy="726" r="35"/>
      <circle cx="292" cy="786" r="31"/>
      <circle cx="196" cy="782" r="29"/>
      <path d="M 105 495 C 78 528 78 572 110 590 C 142 608 182 590 186 554 C 189 523 160 494 138 479 C 122 468 118 481 105 495 Z"/>
    </g>
    <!-- колос пшеницы из устья -->
    <path d="M 375 320 L 460 175" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="400" cy="268" rx="14" ry="30" transform="rotate(28 400 268)"/>
    <ellipse cx="426" cy="224" rx="14" ry="30" transform="rotate(28 426 224)"/>
    <ellipse cx="452" cy="184" rx="13" ry="28" transform="rotate(28 452 184)"/>
