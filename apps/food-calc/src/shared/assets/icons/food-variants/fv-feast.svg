<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="260" cy="800" r="181" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <!-- пиршественный стол: клош по центру, свеча слева, чаша с фруктами справа -->
    <g mask="url(#m)">
      <ellipse cx="470" cy="560" rx="150" ry="26"/>
      <path d="M 340 556 A 130 130 0 0 1 600 556 Z"/>
      <rect x="462" y="392" width="16" height="34" rx="8"/>
      <circle cx="470" cy="384" r="16"/>
      <!-- тарелка слева -->
      <ellipse cx="270" cy="566" rx="86" ry="20"/>
      <!-- чаша с фруктами справа -->
      <ellipse cx="780" cy="566" rx="90" ry="20"/>
      <circle cx="745" cy="522" r="26"/>
      <circle cx="788" cy="510" r="28"/>
      <circle cx="826" cy="526" r="24"/>
      <!-- свеча -->
      <rect x="176" y="400" width="30" height="150" rx="12"/>
      <path d="M 191 342 C 212 372 212 390 191 402 C 170 390 170 372 191 342 Z"/>
      <!-- стол -->
      <rect x="150" y="584" width="724" height="40" rx="16"/>
      <rect x="196" y="624" width="44" height="240"/>
      <rect x="784" y="624" width="44" height="240"/>
      <rect x="196" y="700" width="632" height="24" rx="12"/>
    </g>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="260" cy="800" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="238" y="725" width="44" height="150" rx="14"/>
    <rect x="185" y="778" width="150" height="44" rx="14"/>
  </g>
</svg>
