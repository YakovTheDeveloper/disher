<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="300" cy="720" r="181" fill="#000"/>
      <!-- строки списка: буллет + строка -->
      <circle cx="340" cy="360" r="20" fill="#000"/>
      <rect x="384" y="342" width="160" height="36" rx="18" fill="#000"/>
      <circle cx="340" cy="472" r="20" fill="#000"/>
      <rect x="384" y="454" width="120" height="36" rx="18" fill="#000"/>
      <circle cx="340" cy="584" r="20" fill="#000"/>
      <rect x="384" y="566" width="180" height="36" rx="18" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <!-- чек: «список еды» как кассовая лента с зубчатым низом -->
    <g mask="url(#m)">
      <path d="M 272 252 Q 272 220 304 220 L 560 220 Q 592 220 592 252 L 592 696 L 552 736 L 512 696 L 472 736 L 432 696 L 392 736 L 352 696 L 312 736 L 272 696 Z"/>
    </g>
