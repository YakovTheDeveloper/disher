    <circle cx="300" cy="720" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="278" y="645" width="44" height="150" rx="14"/>
    <rect x="225" y="698" width="150" height="44" rx="14"/>
  </g>
</svg>
