<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <!-- бейдж-плюс: дырка под кольцо -->
      <circle cx="280" cy="800" r="181" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#m)">
      <!-- торговые весы: стойка, коромысло, две чаши -->
      <rect x="344" y="260" width="32" height="500" rx="14"/>
      <circle cx="360" cy="240" r="30"/>
      <rect x="140" y="300" width="440" height="26" rx="13"/>
      <!-- подвесы -->
      <path d="M 180 326 L 120 520 L 240 520 Z" fill="none" stroke="#fff" stroke-width="16"/>
      <path d="M 540 326 L 480 520 L 600 520 Z" fill="none" stroke="#fff" stroke-width="16"/>
      <!-- чаши -->
      <path d="M 90 520 A 90 46 0 0 0 270 520 Z"/>
      <path d="M 450 520 A 90 46 0 0 0 630 520 Z"/>
      <!-- товар на чашах -->
      <circle cx="150" cy="462" r="40"/>
      <circle cx="212" cy="470" r="34"/>
      <path d="M 150 410 C 174 386 210 386 220 392 C 210 416 180 424 150 420 Z"/>
      <rect x="540" y="440" width="60" height="80" rx="16"/>
      <!-- основание -->
      <path d="M 268 760 L 452 760 L 492 840 L 228 840 Z"/>
    </g>
    <!-- бейдж-плюс: нижний левый угол объекта, наползает ~30% -->
    <circle cx="280" cy="800" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="258" y="725" width="44" height="150" rx="14"/>
    <rect x="205" y="778" width="150" height="44" rx="14"/>
  </g>
</svg>
