<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <!-- дуговая отсечка низа (сектор ±65° за r=340): кольцо под подпись медали -->
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
      <!-- тёмный ободок объектива: кольцо — опознавательный знак телескопа -->
      <circle cx="575" cy="450" r="34" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#b)">
      <!-- телескоп на треноге, наведён в небо — наблюдатель событий ночи.
           Айдентика: сужающаяся труба, кольцо объектива, окуляр -->
      <path d="M 200 158 L 214 172 L 200 186 L 186 172 Z"/>
      <path d="M 350 120 L 364 134 L 350 148 L 336 134 Z"/>
      <path d="M 250 336 L 262 348 L 250 360 L 238 348 Z"/>
      <circle cx="140" cy="280" r="7"/>
      <circle cx="320" cy="230" r="7"/>
      <!-- сужающаяся труба: широкая у объектива, узкая у окуляра -->
      <path d="M 300 590 L 560 415 L 600 480 L 340 655 Z"/>
      <!-- кольцо объектива -->
      <circle cx="575" cy="450" r="50"/>
      <!-- окуляр -->
      <rect x="268" y="612" width="60" height="34" rx="10" transform="rotate(-30 298 629)"/>
      <!-- монтировка и тренога -->
      <circle cx="430" cy="610" r="26"/>
      <rect x="422" y="620" width="18" height="230" rx="9"/>
      <rect x="422" y="620" width="18" height="230" rx="9" transform="rotate(18 431 630)"/>
      <rect x="422" y="620" width="18" height="230" rx="9" transform="rotate(-18 431 630)"/>
    </g>
    <circle cx="770" cy="300" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="748" y="225" width="44" height="150" rx="14"/>
    <rect x="695" y="278" width="150" height="44" rx="14"/>
  </g>
</svg>
