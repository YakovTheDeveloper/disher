<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <!-- дуговая отсечка низа (сектор ±65° за r=340): кольцо под подпись медали -->
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
      <!-- арка звонницы (зум: одна большая) -->
      <path d="M 370 1024 L 370 760 Q 370 640 462 640 Q 554 640 554 760 L 554 1024 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#b)">
      <!-- глава во весь верх кадра -->
      <path d="M 462 120
               C 640 230 716 380 716 520
               L 208 520
               C 208 380 284 230 462 120 Z"/>
      <!-- маковка -->
      <circle cx="462" cy="112" r="30"/>
      <rect x="452" y="40" width="20" height="60" rx="10"/>
      <!-- карниз -->
      <rect x="188" y="520" width="548" height="70" rx="12"/>
      <!-- стена звонницы уходит вниз за кадр -->
      <rect x="228" y="590" width="468" height="434"/>
    </g>
    <!-- колокол в проёме: рисуется поверх вырезанной арки; поднят, чтобы
         дуговая отсечка медали не задевала язычок -->
    <circle cx="462" cy="638" r="16"/>
    <path d="M 462 646
             C 414 670 402 718 402 766
             L 390 794
             Q 462 822 534 794
             L 522 766
             C 522 718 510 670 462 646 Z"/>
    <circle cx="462" cy="816" r="20"/>
    <circle cx="770" cy="300" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="748" y="225" width="44" height="150" rx="14"/>
    <rect x="695" y="278" width="150" height="44" rx="14"/>
  </g>
</svg>
