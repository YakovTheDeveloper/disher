<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <!-- дуговая отсечка низа (сектор ±65° за r=340): кольцо под подпись медали -->
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
      <!-- стёкла фонаря: тёмный проём, внутри горит лампа -->
      <rect x="470" y="414" width="84" height="112" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#b)">
      <!-- зум на фонарную комнату (референс: красная крыша, галерея, луч).
           Луч уведён вниз-вправо, чтобы не спорить с бейджем -->
      <path d="M 566 450 L 960 560 L 960 700 L 566 500 Z"/>
      <!-- верх башни уходит вниз за кадр -->
      <path d="M 430 1024 L 452 566 L 572 566 L 594 1024 Z"/>
      <!-- галерея с ограждением -->
      <rect x="404" y="496" width="10" height="44" rx="5"/>
      <rect x="507" y="496" width="10" height="44" rx="5"/>
      <rect x="610" y="496" width="10" height="44" rx="5"/>
      <rect x="392" y="540" width="240" height="26" rx="13"/>
      <!-- фонарная комната -->
      <rect x="448" y="400" width="128" height="140" rx="10"/>
      <!-- купол крыши со шпилем -->
      <path d="M 512 320 C 580 360 600 388 600 400 L 424 400 C 424 388 444 360 512 320 Z"/>
      <circle cx="512" cy="308" r="16"/>
    </g>
    <!-- лампа в тёмном проёме стёкол -->
    <circle cx="512" cy="470" r="26"/>
    <circle cx="770" cy="300" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="748" y="225" width="44" height="150" rx="14"/>
    <rect x="695" y="278" width="150" height="44" rx="14"/>
  </g>
</svg>
