<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <!-- дуговая отсечка низа (сектор ±65° за r=340): кольцо под подпись медали -->
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
      <!-- грани фонаря -->
      <rect x="356" y="496" width="20" height="128" fill="#000"/>
      <rect x="394" y="496" width="20" height="128" fill="#000"/>
      <rect x="432" y="496" width="20" height="128" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#b)">
      <!-- фотографский зум на верхушку маяка: фонарь крупно, луч вправо -->
      <path d="M 492 530 L 1024 640 L 1024 900 Z"/>
      <!-- верх башни уходит вниз за кадр -->
      <path d="M 320 700 L 480 700 L 520 1024 L 280 1024 Z"/>
      <!-- галерея -->
      <rect x="290" y="640" width="220" height="34" rx="17"/>
      <!-- фонарь -->
      <rect x="312" y="480" width="176" height="160" rx="16"/>
      <!-- крыша -->
      <path d="M 400 380 L 500 480 L 300 480 Z"/>
      <circle cx="400" cy="366" r="20"/>
    </g>
    <!-- свет фонаря -->
    <circle cx="400" cy="560" r="34"/>
    <circle cx="770" cy="300" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="748" y="225" width="44" height="150" rx="14"/>
    <rect x="695" y="278" width="150" height="44" rx="14"/>
  </g>
</svg>
