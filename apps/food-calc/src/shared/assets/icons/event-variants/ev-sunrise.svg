<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <!-- дуговая отсечка низа (сектор ±65° за r=340): кольцо под подпись медали -->
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
      <!-- горизонт отсекает нижнюю половину солнца -->
      <rect x="0" y="640" width="1024" height="384" fill="#000"/>
    </mask>
    <mask id="c" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#b)">
      <!-- восход: солнце над горизонтом — начало дня, его события -->
      <circle cx="430" cy="560" r="130"/>
      <!-- лучи веером вверх -->
      <rect x="417" y="330" width="26" height="70" rx="13"/>
      <rect x="417" y="330" width="26" height="70" rx="13" transform="rotate(-35 430 560)"/>
      <rect x="417" y="330" width="26" height="70" rx="13" transform="rotate(35 430 560)"/>
      <rect x="417" y="330" width="26" height="70" rx="13" transform="rotate(-70 430 560)"/>
      <rect x="417" y="330" width="26" height="70" rx="13" transform="rotate(70 430 560)"/>
    </g>
    <g mask="url(#c)">
      <!-- линия горизонта -->
      <rect x="100" y="634" width="660" height="12" rx="6"/>
      <!-- блики на воде -->
      <rect x="370" y="720" width="120" height="22" rx="11"/>
      <rect x="350" y="790" width="160" height="22" rx="11"/>
      <rect x="390" y="860" width="80" height="22" rx="11"/>
    </g>
    <circle cx="770" cy="300" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="748" y="225" width="44" height="150" rx="14"/>
    <rect x="695" y="278" width="150" height="44" rx="14"/>
  </g>
</svg>
