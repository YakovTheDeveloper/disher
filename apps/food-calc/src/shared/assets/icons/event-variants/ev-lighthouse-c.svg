<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <!-- дуговая отсечка низа (сектор ±65° за r=340): кольцо под подпись медали -->
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#b)">
      <!-- маяк целиком, лучи звездой из фонаря (референс: сияние вокруг
           верхушки). Сектор 45–100° пустует: там живёт бейдж -->
      <rect x="418" y="160" width="24" height="100" rx="12" transform="rotate(0 430 395)"/>
      <rect x="418" y="160" width="24" height="100" rx="12" transform="rotate(30 430 395)"/>
      <rect x="418" y="160" width="24" height="100" rx="12" transform="rotate(120 430 395)"/>
      <rect x="418" y="160" width="24" height="100" rx="12" transform="rotate(150 430 395)"/>
      <rect x="418" y="160" width="24" height="100" rx="12" transform="rotate(210 430 395)"/>
      <rect x="418" y="160" width="24" height="100" rx="12" transform="rotate(240 430 395)"/>
      <rect x="418" y="160" width="24" height="100" rx="12" transform="rotate(270 430 395)"/>
      <rect x="418" y="160" width="24" height="100" rx="12" transform="rotate(300 430 395)"/>
      <rect x="418" y="160" width="24" height="100" rx="12" transform="rotate(330 430 395)"/>
      <!-- сужающаяся башня -->
      <path d="M 356 960 L 396 440 L 464 440 L 504 960 Z"/>
      <!-- фонарь и крыша -->
      <rect x="386" y="370" width="88" height="70" rx="8"/>
      <path d="M 430 310 L 482 370 L 378 370 Z"/>
      <circle cx="430" cy="300" r="12"/>
    </g>
    <circle cx="770" cy="300" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="748" y="225" width="44" height="150" rx="14"/>
    <rect x="695" y="278" width="150" height="44" rx="14"/>
  </g>
</svg>
