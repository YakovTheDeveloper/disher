<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <!-- дуговая отсечка низа (сектор ±65° за r=340): кольцо под подпись медали -->
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
      <!-- рёбра изометрической плиты -->
      <rect x="380" y="424" width="250" height="12" fill="#000"/>
      <rect x="624" y="430" width="12" height="350" fill="#000"/>
      <path d="M 624 438 L 704 378 L 716 390 L 636 450 Z" fill="#000"/>
      <!-- арочный проём окна: в нём горит солнце -->
      <path d="M 430 740 L 430 560 Q 430 500 510 500 Q 590 500 590 560 L 590 740 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#b)">
      <!-- изометрическая стена с арочным окном: в окне — солнце,
           мир дня сквозь окно ума -->
      <rect x="380" y="430" width="250" height="350"/>
      <path d="M 380 430 L 460 370 L 710 370 L 630 430 Z"/>
      <path d="M 630 430 L 710 370 L 710 720 L 630 780 Z"/>
    </g>
    <!-- солнце в тёмном проёме -->
    <circle cx="510" cy="636" r="50"/>
    <circle cx="770" cy="300" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="748" y="225" width="44" height="150" rx="14"/>
    <rect x="695" y="278" width="150" height="44" rx="14"/>
  </g>
</svg>
