<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <!-- дуговая отсечка низа (сектор ±65° за r=340): кольцо под подпись медали -->
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#b)">
      <!-- салют над холмами: событие-праздник; большой залп слева,
           малый справа внизу — ритм без столкновения с бейджем -->
      <rect x="388" y="225" width="24" height="90" rx="12" transform="rotate(0 400 420)"/>
      <rect x="388" y="225" width="24" height="90" rx="12" transform="rotate(45 400 420)"/>
      <rect x="388" y="225" width="24" height="90" rx="12" transform="rotate(90 400 420)"/>
      <rect x="388" y="225" width="24" height="90" rx="12" transform="rotate(135 400 420)"/>
      <rect x="388" y="225" width="24" height="90" rx="12" transform="rotate(180 400 420)"/>
      <rect x="388" y="225" width="24" height="90" rx="12" transform="rotate(225 400 420)"/>
      <rect x="388" y="225" width="24" height="90" rx="12" transform="rotate(270 400 420)"/>
      <rect x="388" y="225" width="24" height="90" rx="12" transform="rotate(315 400 420)"/>
      <circle cx="400" cy="420" r="26"/>
      <!-- малый залп -->
      <rect x="641" y="510" width="18" height="60" rx="9" transform="rotate(20 650 620)"/>
      <rect x="641" y="510" width="18" height="60" rx="9" transform="rotate(80 650 620)"/>
      <rect x="641" y="510" width="18" height="60" rx="9" transform="rotate(140 650 620)"/>
      <rect x="641" y="510" width="18" height="60" rx="9" transform="rotate(200 650 620)"/>
      <rect x="641" y="510" width="18" height="60" rx="9" transform="rotate(260 650 620)"/>
      <rect x="641" y="510" width="18" height="60" rx="9" transform="rotate(320 650 620)"/>
      <circle cx="650" cy="620" r="18"/>
      <!-- осыпающиеся искры -->
      <circle cx="250" cy="560" r="8"/>
      <circle cx="500" cy="240" r="8"/>
      <circle cx="180" cy="330" r="7"/>
      <!-- холм -->
      <path d="M 0 950 Q 350 820 700 950 Z"/>
    </g>
    <circle cx="770" cy="300" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="748" y="225" width="44" height="150" rx="14"/>
    <rect x="695" y="278" width="150" height="44" rx="14"/>
  </g>
</svg>
