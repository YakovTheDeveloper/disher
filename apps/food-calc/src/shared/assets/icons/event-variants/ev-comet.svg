      <path d="M 150 236 L 164 250 L 150 264 L 136 250 Z"/>
      <path d="M 420 206 L 434 220 L 420 234 L 406 220 Z"/>
      <path d="M 260 406 L 272 418 L 260 430 L 248 418 Z"/>
      <path d="M 510 120 L 522 132 L 510 144 L 498 132 Z"/>
      <circle cx="300" cy="130" r="8"/>
      <circle cx="110" cy="480" r="8"/>
      <circle cx="360" cy="330" r="7"/>
      <circle cx="180" cy="620" r="7"/>
      <circle cx="680" cy="570" r="8"/>
      <!-- комета: яркая голова + сужающийся хвост вверх-влево -->
      <path d="M 616 436 L 584 468 L 200 150 Z"/>
      <circle cx="600" cy="450" r="30"/>
      <!-- крыша с флюгером -->
      <path d="M 60 860 L 400 680 L 740 860 Z"/>
      <rect x="395" y="576" width="10" height="110" rx="5"/>
      <circle cx="400" cy="566" r="14"/>
      <!-- труба на правом скате -->
      <rect x="560" y="706" width="40" height="90" rx="6"/>
    </g>
    <circle cx="770" cy="300" r="135" fill="none" stroke="#fff" stroke-width="40"/>
    <rect x="748" y="225" width="44" height="150" rx="14"/>
    <rect x="695" y="278" width="150" height="44" rx="14"/>
  </g>
</svg>
