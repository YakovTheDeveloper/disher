<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <mask id="b" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="770" cy="300" r="181" fill="#000"/>
      <!-- дуговая отсечка низа (сектор ±65° за r=340): кольцо под подпись медали -->
      <path d="M 2325 1357 A 2000 2000 0 0 1 -1301 1357 L 204 656 A 340 340 0 0 0 820 656 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#fff">
    <g mask="url(#b)">
